<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="styles/reset.css" />
        <link rel="stylesheet" href="styles/style.css" />
    </head>
    <body>
        <header class="header">
            <div class="container">
                <strong class="logo">
                    <img src="images/logo.svg" alt="greenshop" />
                </strong>

                <nav class="header-nav">
                    <ul class="header-nav_list">
                        <li class="active"><a href="">Home</a></li>
                        <li><a href="">Shop</a></li>
                        <li><a href="">Plant Care</a></li>
                        <li><a href="">Blogs</a></li>
                    </ul>
                </nav>
                <button class="btn">
                    <img src="images/icon-exit.svg" alt="" />
                    <span>Login</span>
                </button>
            </div>
        </header>
        <main>
            <div class="container">
                <section class="banner">
                    <div class="banner_text">
                        <span class="title-add">Welcome to GreenShop</span>
                        <h1>Let’s Make a Better Planet</h1>
                        <p>
                            We are an online plant shop offering a wide range of cheap and trendy plants. Use our plants
                            to create an unique Urban Jungle. Order your favorite plants!
                        </p>
                        <a href="#" class="btn">SHOP NOW</a>
                    </div>
                    <div class="banner_img">
                        <img src="images/img-banner.png" alt="" />
                    </div>
                </section>
            </div>
        </main>
        <footer></footer>
    </body>
</html>
